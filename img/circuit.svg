<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141420"/>
      <stop offset="100%" style="stop-color:#08080e"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ff3b3b" stop-opacity="0.7"/>
      <stop offset="100%" style="stop-color:#ff3b3b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes blink { 0%,45% { opacity: 1; } 55%,100% { opacity: 0.25; } }
    .led { animation: blink 1.4s ease-in-out infinite; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- the live side of the loop glows green, the ground side is gray -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M74 104 V62 H98" stroke="#46d160"/>
    <path d="M158 62 H182 V92" stroke="#46d160"/>
    <path d="M182 122 V156 H74 V128" stroke="#8a8a94"/>
  </g>

  <!-- resistor -->
  <polyline points="98,62 104,50 116,74 128,50 140,74 152,50 158,62" fill="none"
            stroke="#e0a468" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- battery: long plate +, short plate − -->
  <line x1="58" y1="104" x2="90" y2="104" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
  <line x1="65" y1="118" x2="83" y2="118" stroke="#ffd166" stroke-width="7" stroke-linecap="round"/>
  <path d="M74 118 V128" stroke="#8a8a94" stroke-width="4" fill="none"/>
  <text x="46" y="100" font-family="monospace" font-size="14" font-weight="bold" fill="#ff5a5a">+</text>

  <!-- LED, glowing, with its light -->
  <g class="led">
    <circle cx="182" cy="107" r="30" fill="url(#glow)"/>
    <path d="M168 92 H196 L182 114 Z" fill="#ff4040"/>
    <line x1="168" y1="118" x2="196" y2="118" stroke="#ff4040" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#ff8a8a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M202 96 L214 88 M209 88 H214 V93"/>
      <path d="M204 108 L216 100 M211 100 H216 V105"/>
    </g>
  </g>
  <path d="M182 118 V122" stroke="#8a8a94" stroke-width="4"/>

  <text x="128" y="200" font-family="monospace" font-size="22" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="3">circuit</text>
  <text x="128" y="218" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">electronics bench</text>
</svg>
